<div class="container-fluid">
<div class="row ">
  <nav class="navbar navbar-expand-lg navbar-light bg-info bgcolor" style="color: #00ffcc;">
    <div class="col-sm-8 m-1">
      <a class="navbar-brand" [routerLink]="''">
        <img src="../../images/logo/logo.png" alt="Logo" class="logo">
        <!-- Aarnav Scientific -->
      </a>

    class="navbar-toggler m-3"
    type="button"
    data-bs-toggle="collapse"

    aria-expanded="false"
    aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  
  <div class="collapse navbar-collapse col col-lg-2 m-3" id="navbarNav">
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" [routerLink]="''">Home</a></li>

      <li class="nav-item"><a class="nav-link" [routerLink]="'product'">Product Portfolio</a></li>
      <li class="nav-item dropdown" (click)="toggleDropdown()" [class.show]="isDropdownOpen">
        <a class="nav-link dropdown-toggle" id="downloadsDropdown" role="button">
          Downloads
        </a>
        <div class="dropdown-menu" [class.show]="isDropdownOpen">
          <a class="dropdown-item" [routerLink]="'downloads/catalogue'">Catalogue</a>
          <a class="dropdown-item" [routerLink]="'downloads/certification'">Certification</a>
          <a class="dropdown-item" [routerLink]="'downloads/packing'">Packing</a>
        </div>
      </li>

    </ul>


  </div>

</nav>
</div>
